<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 3 - Javascript</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
    </style>
  </head>
  <body>
    <h2>Manajemen Produk Toko</h2>
    <button onclick="tampilkanProduk()">Tampilkan Produk</button>
    <button onclick="tambahProduk('Headset', 500000, 8)">
      Tambah Produk (Headset)
    </button>
    <button onclick="hapusProduk(2)">Hapus Produk dengan ID</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Harga</th>
                <th>Stok</th>
            </tr>
        </thead>
        <tbody id="tbodyProduk">
            <!-- Data akan masuk ke table ini -->
        </tbody>
    </table>

    <script>
      let produkToko = [
        { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },

        { id: 2, nama: "Mouse", harga: 200000, stok: 10 },

        { id: 3, nama: "Keyboard", harga: 350000, stok: 7 },
      ];

      function tambahProduk(nama, harga, stok) {
          let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
          produkToko.push({ id: idBaru, nama: nama, harga: harga, stok: stok });
        alert(`Produk ${nama} berhasil ditambahkan!`);
        tampilkanProduk();
        }

      function hapusProduk(id) {
          let index = produkToko.findIndex((produk) => produk.id === id);
          if (index !== -1) {
              alert(`Produk dengan ID ${id} berhasil dihapus!`);
              produkToko.splice(index, 1);
              tampilkanProduk();
          } else {
              alert(`Produk dengan ID ${id} tidak ditemukan!`);
          }
      }

      function tampilkanProduk() {
        let tbody = document.getElementById("tbodyProduk");
        tbody.innerHTML = "";
       produkToko.forEach(p => {
                let row = `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nama}</td>
                        <td>Rp${p.harga.toLocaleString()}</td>
                        <td>${p.stok}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

    </script>
  </body>
</html>
