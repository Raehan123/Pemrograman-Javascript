<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pertemuan 2 - JavaScript</title>
    <style>
      table {
        border-collapse: collapse;
        width: 60%;
        margin: 20px auto;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 8px 12px;
        text-align: center;
      }
      thead {
        background: #f2f2f2;
      }
      tfoot {
        background: #d9edf7;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Nama Pegawai</th>
          <th>Umur</th>
          <th>Jabatan</th>
          <th>Status</th>
          <th>Gaji Pokok</th>
          <th>Tunjangan Jabatan</th>
          <th>BPJS</th>
          <th>Tunjangan Keluarga</th>
        </tr>
      </thead>
      <tbody id="data-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="8" id="total-gaji">Total Gaji:</td>
        </tr>
      </tfoot>
    </table>

    <script>
        const pegawai = {
            nama: "Dodi Prayodi",
            umur: 25,
            jabatan: "manajer",
            status: "menikah"
        };

        let gapok = 0;
        if (pegawai.jabatan.toLowerCase() === "manajer") {
            gapok = 15000000
        } else if (pegawai.jabatan.toLowerCase() === "asisten manajer") {
            gapok = 10000000
        } else if (pegawai.jabatan.toLowerCase() === "staff") {
            gapok = 5000000
        }

        const tunjangan_jabatan = 0.15 * gapok;
        const bpjs = 0.10 * gapok;
        const tunjangan_keluarga = pegawai.status.toLowerCase() === "menikah" ? 0.20 * gapok : 0;
        const total_gaji = gapok + tunjangan_jabatan + bpjs + tunjangan_keluarga;

        const tbody = document.getElementById("data-body");
        const tfoot = document.getElementById("total-gaji");
        tbody.innerHTML = `
            <tr>
                <td>${pegawai.nama}</td>
                <td>${pegawai.umur}</td>
                <td>${pegawai.jabatan}</td>
                <td>${pegawai.status}</td>
                <td>${gapok}</td>
                <td>${tunjangan_jabatan}</td>
                <td>${bpjs}</td>
                <td>${tunjangan_keluarga}</td>
            </tr>
        `;
        tfoot.innerHTML = `Total Gaji: ${total_gaji}`
        
    </script>
  </body>
</html>
